<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - CV Asianindo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#330e7a',
                        secondary: '#4a2c91',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
        
        // Format Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        async function checkLogin() {
            try {
                const res = await fetch('auth_api.php?action=get_profile');
                if(!res.ok) throw new Error();
                const data = await res.json();
                if(!data.success) {
                    window.location.href = 'login.html?redirect=keranjang.html';
                }
            } catch(e) {
                window.location.href = 'login.html?redirect=keranjang.html';
            }
        }

        let cartItems = [];

        async function loadCart() {
            const res = await fetch('cart_api.php?action=get_cart');
            const data = await res.json();
            const container = document.getElementById('cart-items-container');
            const emptyState = document.getElementById('empty-state');
            
            if(data.success && data.items.length > 0) {
                cartItems = data.items.map(item => ({...item, selected: true}));
                emptyState.classList.add('hidden');
                container.classList.remove('hidden');
                document.getElementById('checkout-bar').classList.remove('hidden');
                renderCart();
            } else {
                emptyState.classList.remove('hidden');
                container.classList.add('hidden');
                document.getElementById('checkout-bar').classList.add('hidden');
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            
            let allSelected = cartItems.length > 0 && cartItems.every(i => i.selected);
            document.getElementById('select-all-top').checked = allSelected;
            document.getElementById('select-all-bottom').checked = allSelected;

            cartItems.forEach((item, index) => {
                container.innerHTML += `
                    <div class="flex items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded focus:ring-primary item-checkbox" data-index="${index}" ${item.selected ? 'checked' : ''}>
                        <img src="${item.product_image || 'https://via.placeholder.com/100'}" alt="${item.product_name}" class="w-20 h-20 object-cover rounded-lg border">
                        <div class="flex-1">
                            <h3 class="font-heading font-semibold text-gray-800 line-clamp-2">${item.product_name}</h3>
                            <p class="text-primary font-bold mt-1">${formatRupiah(item.product_price)}</p>
                        </div>
                        <div class="flex flex-col items-end gap-3">
                            <button onclick="removeItem(${item.product_id})" class="text-red-500 hover:text-red-700">
                                <span class="material-symbols-outlined text-xl">delete</span>
                            </button>
                            <div class="flex items-center border rounded-lg">
                                <button onclick="updateQty(${index}, ${item.quantity - 1})" class="px-3 py-1 hover:bg-gray-100 rounded-l-lg">-</button>
                                <input type="number" value="${item.quantity}" readonly class="w-12 text-center text-sm font-medium focus:outline-none border-x">
                                <button onclick="updateQty(${index}, ${item.quantity + 1})" class="px-3 py-1 hover:bg-gray-100 rounded-r-lg">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            // Add listeners to checkboxes
            document.querySelectorAll('.item-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    cartItems[idx].selected = e.target.checked;
                    updateSummary();
                });
            });
            updateSummary();
        }

        async function updateQty(index, newQty) {
            if(newQty < 1) return;
            const item = cartItems[index];
            const fd = new FormData();
            fd.append('action', 'update_qty');
            fd.append('product_id', item.product_id);
            fd.append('quantity', newQty);
            
            await fetch('cart_api.php', { method: 'POST', body: fd });
            item.quantity = newQty;
            renderCart();
        }

        async function removeItem(productId) {
            if(!confirm('Hapus produk ini dari keranjang?')) return;
            const fd = new FormData();
            fd.append('action', 'remove_item');
            fd.append('product_id', productId);
            await fetch('cart_api.php', { method: 'POST', body: fd });
            loadCart();
        }

        function toggleSelectAll(checked) {
            cartItems.forEach(i => i.selected = checked);
            renderCart();
        }

        function updateSummary() {
            let total = 0;
            let count = 0;
            cartItems.forEach(i => {
                if(i.selected) {
                    total += i.product_price * i.quantity;
                    count++;
                }
            });
            
            document.getElementById('total-price').textContent = formatRupiah(total);
            document.getElementById('checkout-btn').textContent = `Checkout (${count})`;
            document.getElementById('checkout-btn').disabled = count === 0;
            if(count === 0) {
                document.getElementById('checkout-btn').classList.replace('bg-primary', 'bg-gray-400');
            } else {
                document.getElementById('checkout-btn').classList.replace('bg-gray-400', 'bg-primary');
            }
            
            let allSelected = cartItems.length > 0 && cartItems.every(i => i.selected);
            document.getElementById('select-all-top').checked = allSelected;
            document.getElementById('select-all-bottom').checked = allSelected;
        }

        function proceedToCheckout() {
            const selectedItems = cartItems.filter(i => i.selected);
            if(selectedItems.length === 0) return;
            sessionStorage.setItem('checkout_items', JSON.stringify(selectedItems));
            sessionStorage.setItem('is_from_cart', 'true');
            window.location.href = 'checkout.html';
        }

        window.onload = () => {
            checkLogin();
            loadCart();
        };
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-28">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-primary text-white shadow-md">
        <div class="container mx-auto px-4 h-16 flex items-center gap-4 max-w-4xl">
            <button onclick="window.history.back()" class="hover:bg-secondary p-2 rounded-full transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="text-xl font-heading font-semibold flex-1">Keranjang Saya</h1>
        </div>
    </header>

    <main class="container mx-auto px-4 mt-6 max-w-4xl min-h-[60vh]">
        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20">
            <span class="material-symbols-outlined text-8xl text-gray-300 mb-4">shopping_cart</span>
            <h2 class="text-2xl font-heading font-bold text-gray-700 mb-2">Keranjang belanja kosong</h2>
            <p class="text-gray-500 mb-6 text-center">Yuk, isi dengan mesin industri terbaik dari Asianindo!</p>
            <a href="katalog.html" class="bg-primary text-white px-8 py-3 rounded-full font-medium shadow-lg shadow-primary/30 hover:bg-secondary transition">Mulai Belanja</a>
        </div>

        <!-- Cart Content -->
        <div id="cart-items-container" class="hidden">
            <!-- Select All Top -->
            <div class="flex items-center gap-3 bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
                <input type="checkbox" id="select-all-top" class="w-5 h-5 text-primary rounded focus:ring-primary" onchange="toggleSelectAll(this.checked)">
                <label for="select-all-top" class="font-medium">Pilih Semua</label>
            </div>
            <!-- Items rendered here -->
        </div>
    </main>

    <!-- Sticky Checkout Bar -->
    <div id="checkout-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
        <div class="container mx-auto px-4 py-4 max-w-4xl flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <input type="checkbox" id="select-all-bottom" class="w-5 h-5 text-primary rounded focus:ring-primary" onchange="toggleSelectAll(this.checked)">
                <label for="select-all-bottom" class="text-sm font-medium hidden sm:block">Semua</label>
            </div>
            
            <div class="flex items-center gap-4 md:gap-8 flex-1 justify-end">
                <div class="text-right">
                    <p class="text-sm text-gray-500">Total Pembayaran</p>
                    <p id="total-price" class="text-xl font-heading font-bold text-primary">Rp 0</p>
                </div>
                <button id="checkout-btn" onclick="proceedToCheckout()" class="bg-primary hover:bg-secondary text-white font-semibold py-3 px-6 md:px-10 rounded-full transition-colors shadow-lg shadow-primary/30 disabled:opacity-50">
                    Checkout (0)
                </button>
            </div>
        </div>
    </div>

</body>
</html>
