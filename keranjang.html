<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - CV Asianindo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#330e7a',
                        secondary: '#4a2c91',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
        
        // Format Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        async function checkLogin() {
            try {
                const res = await fetch('auth_api.php?action=get_profile');
                if(!res.ok) throw new Error();
                const data = await res.json();
                if(!data.success) {
                    window.location.href = 'login.html?redirect=keranjang.html';
                }
            } catch(e) {
                window.location.href = 'login.html?redirect=keranjang.html';
            }
        }

        let cartItems = [];

        async function loadCart() {
            const res = await fetch('cart_api.php?action=get_cart');
            const data = await res.json();
            const container = document.getElementById('cart-items-container');
            const emptyState = document.getElementById('empty-state');
            
            if(data.success && data.items.length > 0) {
                cartItems = data.items.map(item => ({...item, selected: true}));
                emptyState.classList.add('hidden');
                container.classList.remove('hidden');
                document.getElementById('checkout-bar').classList.remove('hidden');
                renderCart();
            } else {
                emptyState.classList.remove('hidden');
                container.classList.add('hidden');
                document.getElementById('checkout-bar').classList.add('hidden');
            }
        }

        function renderCart() {
            const listContainer = document.getElementById('cart-items-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            
            let allSelected = cartItems.length > 0 && cartItems.every(i => i.selected);
            const selectAllTop = document.getElementById('select-all-top');
            const selectAllBottom = document.getElementById('select-all-bottom');
            if (selectAllTop) selectAllTop.checked = allSelected;
            if (selectAllBottom) selectAllBottom.checked = allSelected;

            cartItems.forEach((item, index) => {
                const prodIdSafe = String(item.product_id).replace(/'/g, "\\'");
                listContainer.innerHTML += `
                    <div class="flex items-start gap-3 sm:gap-4 bg-white p-3.5 sm:p-4 rounded-2xl shadow-xs border border-gray-100 mb-3 sm:mb-4">
                        <div class="flex items-center pt-2">
                            <input type="checkbox" class="w-4 h-4 sm:w-5 sm:h-5 text-primary rounded focus:ring-primary item-checkbox cursor-pointer" data-index="${index}" ${item.selected ? 'checked' : ''}>
                        </div>
                        <img src="${item.product_image || 'images/placeholder.webp'}" alt="${item.product_name}" class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-xl border border-gray-100 flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start gap-2">
                                <h3 class="font-heading font-semibold text-gray-800 line-clamp-2 text-xs sm:text-sm leading-snug">${item.product_name}</h3>
                                <button onclick="removeItem('${prodIdSafe}')" class="text-gray-400 hover:text-red-500 p-1 transition flex-shrink-0" title="Hapus">
                                    <span class="material-symbols-outlined text-lg">delete</span>
                                </button>
                            </div>
                            <div class="flex flex-wrap items-center justify-between gap-2 mt-2 pt-1">
                                <p class="text-primary font-bold text-xs sm:text-base">${formatRupiah(item.product_price)}</p>
                                <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden bg-white">
                                    <button onclick="updateQty(${index}, ${item.quantity - 1})" class="px-2.5 py-0.5 sm:py-1 hover:bg-gray-100 font-bold text-gray-600 text-xs sm:text-sm">-</button>
                                    <input type="number" value="${item.quantity}" readonly class="w-9 sm:w-12 text-center text-xs sm:text-sm font-medium focus:outline-none border-x border-gray-200 bg-gray-50/50 py-0.5">
                                    <button onclick="updateQty(${index}, ${item.quantity + 1})" class="px-2.5 py-0.5 sm:py-1 hover:bg-gray-100 font-bold text-gray-600 text-xs sm:text-sm">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            // Add listeners to checkboxes
            document.querySelectorAll('.item-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    cartItems[idx].selected = e.target.checked;
                    updateSummary();
                });
            });
            updateSummary();
        }

        async function updateQty(index, newQty) {
            if (newQty < 1) return;
            const item = cartItems[index];
            const fd = new FormData();
            fd.append('action', 'update_qty');
            fd.append('product_id', item.product_id);
            fd.append('quantity', newQty);
            
            await fetch('cart_api.php?action=update_qty', { method: 'POST', body: fd });
            item.quantity = newQty;
            renderCart();
        }

        async function removeItem(productId) {
            if (!confirm('Hapus produk ini dari keranjang?')) return;
            const fd = new FormData();
            fd.append('action', 'remove_item');
            fd.append('product_id', productId);
            await fetch('cart_api.php?action=remove_item', { method: 'POST', body: fd });
            loadCart();
        }

        function toggleSelectAll(checked) {
            cartItems.forEach(i => i.selected = checked);
            renderCart();
        }

        function updateSummary() {
            let total = 0;
            let count = 0;
            cartItems.forEach(i => {
                if(i.selected) {
                    total += i.product_price * i.quantity;
                    count++;
                }
            });
            
            const totalPriceEl = document.getElementById('total-price');
            const checkoutBtn = document.getElementById('checkout-btn');
            if (totalPriceEl) totalPriceEl.textContent = formatRupiah(total);
            if (checkoutBtn) {
                checkoutBtn.textContent = `Checkout (${count})`;
                checkoutBtn.disabled = count === 0;
                if(count === 0) {
                    checkoutBtn.classList.remove('bg-primary', 'hover:bg-secondary');
                    checkoutBtn.classList.add('bg-gray-400');
                } else {
                    checkoutBtn.classList.remove('bg-gray-400');
                    checkoutBtn.classList.add('bg-primary', 'hover:bg-secondary');
                }
            }
            
            let allSelected = cartItems.length > 0 && cartItems.every(i => i.selected);
            const selectAllTop = document.getElementById('select-all-top');
            const selectAllBottom = document.getElementById('select-all-bottom');
            if (selectAllTop) selectAllTop.checked = allSelected;
            if (selectAllBottom) selectAllBottom.checked = allSelected;
        }

        function proceedToCheckout() {
            const selectedItems = cartItems.filter(i => i.selected);
            if(selectedItems.length === 0) return;
            sessionStorage.setItem('checkout_items', JSON.stringify(selectedItems));
            sessionStorage.setItem('is_from_cart', 'true');
            window.location.href = 'checkout.html';
        }

        window.onload = () => {
            loadCart();
        };
    </script>
</head>
<body class="bg-[#f8f9fa] text-gray-800 font-sans pb-28 antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-primary text-white shadow-md">
        <div class="container mx-auto px-4 h-14 sm:h-16 flex items-center gap-3 sm:gap-4 max-w-4xl">
            <button onclick="window.history.back()" class="hover:bg-secondary p-1.5 sm:p-2 rounded-full transition-colors">
                <span class="material-symbols-outlined text-xl sm:text-2xl">arrow_back</span>
            </button>
            <h1 class="text-base sm:text-xl font-heading font-semibold flex-1">Keranjang Saya</h1>
        </div>
    </header>

    <main class="container mx-auto px-3 sm:px-4 mt-4 sm:mt-6 max-w-4xl min-h-[60vh]">
        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 sm:py-20">
            <span class="material-symbols-outlined text-6xl sm:text-8xl text-gray-300 mb-4">shopping_cart</span>
            <h2 class="text-xl sm:text-2xl font-heading font-bold text-gray-700 mb-2">Keranjang belanja kosong</h2>
            <p class="text-xs sm:text-sm text-gray-500 mb-6 text-center">Yuk, isi dengan mesin industri terbaik dari Asianindo!</p>
            <a href="katalog.html" class="bg-primary text-white px-6 sm:px-8 py-2.5 sm:py-3 rounded-xl font-medium shadow-md shadow-primary/20 hover:bg-secondary transition text-xs sm:text-sm">Mulai Belanja</a>
        </div>

        <!-- Cart Content -->
        <div id="cart-items-container" class="hidden">
            <!-- Select All Top -->
            <div class="flex items-center gap-3 bg-white p-3.5 sm:p-4 rounded-2xl shadow-xs border border-gray-100 mb-3 sm:mb-4">
                <input type="checkbox" id="select-all-top" class="w-4 h-4 sm:w-5 sm:h-5 text-primary rounded focus:ring-primary cursor-pointer" onchange="toggleSelectAll(this.checked)">
                <label for="select-all-top" class="font-medium cursor-pointer text-xs sm:text-sm">Pilih Semua</label>
            </div>
            <!-- Items rendered here -->
            <div id="cart-items-list"></div>
        </div>
    </main>

    <!-- Sticky Checkout Bar -->
    <div id="checkout-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 shadow-xl z-40">
        <div class="container mx-auto px-3 sm:px-4 py-2.5 sm:py-3.5 max-w-4xl flex items-center justify-between gap-2 sm:gap-4">
            <div class="flex items-center gap-2">
                <input type="checkbox" id="select-all-bottom" class="w-4 h-4 sm:w-5 sm:h-5 text-primary rounded focus:ring-primary cursor-pointer" onchange="toggleSelectAll(this.checked)">
                <label for="select-all-bottom" class="text-xs sm:text-sm font-medium text-gray-700">Semua</label>
            </div>
            
            <div class="flex items-center gap-2.5 sm:gap-6 flex-1 justify-end">
                <div class="text-right">
                    <p class="text-[10px] sm:text-xs text-gray-500">Total Pembayaran</p>
                    <p id="total-price" class="text-sm sm:text-lg font-heading font-extrabold text-primary">Rp 0</p>
                </div>
                <button id="checkout-btn" onclick="proceedToCheckout()" class="bg-primary hover:bg-secondary text-white font-bold py-2.5 sm:py-3 px-4 sm:px-8 rounded-xl transition shadow-md shadow-primary/20 disabled:opacity-50 text-xs sm:text-sm active:scale-95">
                    Checkout (0)
                </button>
            </div>
        </div>
    </div>

</body>
</html>
