<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tracking Pesanan - CV Asianindo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Outfit', sans-serif; }
        .gradient-primary { background: linear-gradient(135deg, #330e7a 0%, #4a2c91 100%); }
    </style>
</head>
<body class="bg-[#f8f9fa] text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="gradient-primary text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 sm:py-3.5 flex items-center justify-between max-w-3xl">
            <div class="flex items-center gap-2 sm:gap-2.5">
                <span class="material-symbols-outlined text-2xl sm:text-3xl">precision_manufacturing</span>
                <span class="font-bold text-lg sm:text-xl font-heading tracking-tight">CV Asianindo</span>
            </div>
            <div class="text-[11px] sm:text-xs font-semibold bg-white/15 px-2.5 py-1 rounded-full backdrop-blur-sm border border-white/20">Status Pesanan</div>
        </div>
    </header>

    <main class="container mx-auto px-3 sm:px-4 py-4 sm:py-8 max-w-3xl space-y-4 sm:space-y-6 flex-1" id="app_content">
        <div class="text-center py-12" id="loading">
            <span class="material-symbols-outlined animate-spin text-4xl text-[#330e7a]">autorenew</span>
            <p class="mt-2 text-xs sm:text-sm text-gray-500">Memuat detail pesanan...</p>
        </div>
        
        <!-- Content will be injected here via JS -->
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderNumber = urlParams.get('order_number');
        
        if (!orderNumber) {
            alert('Nomor pesanan tidak ditemukan.');
            window.location.href = 'index.html';
        }

        function formatRupiah(angka, prefix) {
            var number_string = angka.toString().replace(/[^,\d]/g, ''),
            split = number_string.split(','),
            sisa = split[0].length % 3,
            rupiah = split[0].substr(0, sisa),
            ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if(ribuan){
                separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            return prefix == undefined ? rupiah : (rupiah ? 'Rp ' + rupiah : '');
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Berhasil disalin: ' + text);
            });
        }

        fetch(`tracking_api.php?action=get_tracking&order_number=${orderNumber}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    renderApp(data);
                } else {
                    document.getElementById('app_content').innerHTML = `
                        <div class="bg-red-50 text-red-500 p-6 rounded-xl text-center">
                            <span class="material-symbols-outlined text-4xl mb-2">error</span>
                            <p>${data.message}</p>
                            <a href="index.html" class="inline-block mt-4 bg-red-500 text-white px-4 py-2 rounded">Kembali ke Beranda</a>
                        </div>
                    `;
                }
            })
            .catch(err => {
                document.getElementById('app_content').innerHTML = '<div class="text-center text-red-500">Gagal memuat data.</div>';
            });

        function renderApp(data) {
            const { order, shipping, customer, items, timeline } = data;

            let timelineHTML = '<div class="relative border-l border-gray-200 ml-3 space-y-6">';
            Object.values(timeline).forEach(step => {
                const isCompleted = step.completed;
                const iconClass = isCompleted ? 'bg-[#330e7a] text-white' : 'bg-gray-200 text-gray-400';
                const textClass = isCompleted ? 'text-gray-800' : 'text-gray-400';
                
                timelineHTML += `
                    <div class="mb-8 ml-6">
                        <span class="absolute flex items-center justify-center w-6 h-6 rounded-full -left-3 ring-8 ring-white ${iconClass}">
                            <span class="material-symbols-outlined text-sm">${isCompleted ? 'check' : 'circle'}</span>
                        </span>
                        <h3 class="font-bold text-sm md:text-base ${textClass}">${step.title}</h3>
                        ${step.date ? `<time class="block mb-2 text-xs font-normal text-gray-500">${step.date}</time>` : ''}
                    </div>
                `;
            });
            timelineHTML += '</div>';

            let itemsHTML = '';
            items.forEach(item => {
                itemsHTML += `
                    <div class="flex items-center gap-3 sm:gap-4 py-3 border-b border-gray-100 last:border-0">
                        <div class="w-14 h-14 sm:w-16 sm:h-16 bg-gray-100 rounded-xl flex-shrink-0 flex items-center justify-center overflow-hidden border border-gray-100">
                            ${item.image_url ? `<img src="${item.image_url}" class="w-full h-full object-cover">` : '<span class="material-symbols-outlined text-gray-400">image</span>'}
                        </div>
                        <div class="flex-grow min-w-0">
                            <h4 class="font-semibold text-gray-800 text-xs sm:text-sm line-clamp-2 leading-snug">${item.name}</h4>
                            <p class="text-[11px] sm:text-xs text-gray-500 mt-0.5">${item.quantity} x ${formatRupiah(item.price, 'Rp')}</p>
                        </div>
                        <div class="font-bold text-[#330e7a] text-xs sm:text-sm flex-shrink-0">
                            ${formatRupiah(item.quantity * item.price, 'Rp')}
                        </div>
                    </div>
                `;
            });

            const waText = encodeURIComponent(`Halo CV Asianindo, saya ingin bertanya tentang pesanan saya dengan nomor ${order.order_number}`);

            let shippingHTML = '';
            if (shipping.tracking_number) {
                shippingHTML = `
                    <div class="bg-blue-50/80 border border-blue-100 rounded-2xl p-3.5 sm:p-4 mt-4">
                        <div class="flex justify-between items-center mb-2">
                            <div class="text-xs text-gray-500 font-medium">Nomor Resi / Surat Jalan</div>
                            <button onclick="copyText('${shipping.tracking_number}')" class="text-blue-600 flex items-center text-xs font-semibold bg-white border border-blue-200 px-2.5 py-1 rounded-lg hover:bg-blue-50 transition active:scale-95 shadow-2xs">
                                <span class="material-symbols-outlined mr-1 text-sm">content_copy</span> Salin
                            </button>
                        </div>
                        <div class="font-bold text-base sm:text-lg text-gray-900 mb-1 tracking-wide">${shipping.tracking_number}</div>
                        <div class="text-xs sm:text-sm font-semibold text-blue-700">${shipping.expedition_name || '-'}</div>
                        
                        ${shipping.notes ? `
                            <div class="mt-3 p-3 bg-white rounded-xl border border-blue-100 text-xs text-gray-600">
                                <strong class="block text-gray-800 mb-1">Catatan Pengiriman:</strong>
                                ${shipping.notes}
                            </div>
                        ` : ''}
                        
                        ${shipping.estimated_arrival ? `
                            <div class="mt-3 flex items-center text-xs sm:text-sm text-gray-600">
                                <span class="material-symbols-outlined text-gray-400 mr-1.5 text-base">calendar_month</span>
                                Estimasi Sampai: <strong class="ml-1 text-gray-900">${shipping.estimated_arrival}</strong>
                            </div>
                        ` : ''}
                    </div>
                `;
            } else {
                shippingHTML = `
                    <div class="bg-gray-50 border border-gray-100 rounded-xl p-3.5 sm:p-4 mt-4 text-center text-xs sm:text-sm text-gray-500">
                        Nomor resi belum tersedia. Pesanan sedang diproses atau menunggu penjemputan ekspedisi.
                    </div>
                `;
            }

            const isPendingPayment = order.status === 'pending' || order.status === 'pending_payment';
            let paymentActionHTML = '';
            if (isPendingPayment) {
                paymentActionHTML = `
                    <div class="mt-4 p-3.5 sm:p-4 bg-amber-50 border border-amber-200 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                        <div class="text-xs sm:text-sm text-amber-900"><strong class="font-bold">Menunggu Pembayaran!</strong> Segera upload bukti transfer Anda.</div>
                        <a href="pembayaran.html?order_number=${order.order_number}" class="bg-[#330e7a] hover:bg-[#4a2c91] text-white text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl shadow-xs text-center transition active:scale-95 flex-shrink-0">Bayar Sekarang</a>
                    </div>
                `;
            }

            const html = `
                <!-- Order Header -->
                <div class="bg-white rounded-2xl shadow-xs p-3.5 sm:p-4 border border-gray-100 flex justify-between items-center">
                    <div>
                        <div class="text-[11px] sm:text-xs text-gray-500 mb-0.5">Nomor Pesanan</div>
                        <div class="font-bold text-gray-900 text-sm sm:text-base">${order.order_number}</div>
                    </div>
                    <div class="text-right">
                        <span class="inline-block px-2.5 py-1 rounded-full text-[11px] sm:text-xs font-bold bg-purple-100 text-purple-900 capitalize">
                            ${order.status.replace(/_/g, ' ')}
                        </span>
                    </div>
                </div>

                <!-- Timeline -->
                <div class="bg-white rounded-2xl shadow-xs p-4 sm:p-6 border border-gray-100">
                    <h3 class="text-base sm:text-lg font-bold text-gray-900 mb-5 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[#330e7a] text-xl">local_shipping</span>
                        Status Pengiriman
                    </h3>
                    ${timelineHTML}
                    ${shippingHTML}
                </div>

                <!-- Address -->
                <div class="bg-white rounded-2xl shadow-xs p-4 sm:p-6 border border-gray-100">
                    <h3 class="text-base sm:text-lg font-bold text-gray-900 mb-3 flex items-center gap-2 border-b border-gray-100 pb-3">
                        <span class="material-symbols-outlined text-[#330e7a] text-xl">location_on</span>
                        Alamat Pengiriman
                    </h3>
                    <div class="text-xs sm:text-sm text-gray-600 space-y-1 leading-relaxed">
                        <strong class="text-gray-900 block text-sm sm:text-base">${customer.name}</strong>
                        <div>${customer.phone}</div>
                        <div class="pt-0.5 text-gray-700">${customer.address}</div>
                    </div>
                </div>

                <!-- Items -->
                <div class="bg-white rounded-2xl shadow-xs p-4 sm:p-6 border border-gray-100">
                    <h3 class="text-base sm:text-lg font-bold text-gray-900 mb-3 flex items-center gap-2 border-b border-gray-100 pb-3">
                        <span class="material-symbols-outlined text-[#330e7a] text-xl">inventory_2</span>
                        Rincian Pesanan
                    </h3>
                    <div class="mb-3">
                        ${itemsHTML}
                    </div>
                    <div class="space-y-2 text-xs sm:text-sm pt-3 border-t border-gray-100">
                        <div class="flex justify-between text-gray-500">
                            <span>Subtotal Produk</span>
                            <span class="font-medium text-gray-800">${formatRupiah(order.total_amount - (order.shipping_cost || 0), 'Rp')}</span>
                        </div>
                        <div class="flex justify-between text-gray-500">
                            <span>Ongkos Kirim</span>
                            <span class="font-medium text-gray-800">${formatRupiah(order.shipping_cost || 0, 'Rp')}</span>
                        </div>
                        <div class="flex justify-between font-extrabold text-base sm:text-lg text-[#330e7a] pt-2 border-t border-gray-100 mt-2">
                            <span>Total Nilai Pesanan</span>
                            <span>${formatRupiah(order.total_amount, 'Rp')}</span>
                        </div>
                    </div>
                    ${paymentActionHTML}
                </div>

                <!-- Action Button -->
                <div class="pb-8 flex flex-col gap-2.5">
                    <a href="https://wa.me/6285335850517?text=${waText}" target="_blank" class="w-full bg-[#25D366] hover:bg-[#1EBE5D] text-white font-bold py-3.5 px-4 rounded-xl shadow-md shadow-emerald-600/20 text-center transition flex items-center justify-center gap-2 text-xs sm:text-sm active:scale-98">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133-.298-.347-.446-.52-.149-.174-.198-.298-.298-.497-.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074-.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413-.248-.694-.248-1.289-.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        <span>Tanya Admin WhatsApp (085335850517)</span>
                    </a>
                    <a href="akun.html#pesanan" class="w-full bg-white border border-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-2xs text-center hover:bg-gray-50 transition text-xs sm:text-sm active:scale-98">
                        Kembali ke Pesanan Saya
                    </a>
                </div>
            `;

            document.getElementById('app_content').innerHTML = html;
        }
    </script>
</body>
</html>
